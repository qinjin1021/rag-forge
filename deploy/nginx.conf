# 生产环境Nginx反向代理配置
# 用途: HTTPS终止 + 负载均衡 + SSE流式透传 + 静态页面缓存
# 放置: /etc/nginx/conf.d/rag.conf  (先 certbot 申请证书)

# 后端服务(可加多台实现水平扩展)
upstream rag_backend {
    server 127.0.0.1:8000;
    # server 10.0.0.11:8000;  # 扩容时追加节点
}

server {
    listen 80;
    server_name kb.example.com;              # 换成你的域名
    return 301 https://$host$request_uri;    # 全站强制跳转HTTPS
}

server {
    listen 443 ssl;
    http2 on;
    server_name kb.example.com;

    # 证书路径(certbot自动生成)
    ssl_certificate     /etc/letsencrypt/live/kb.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kb.example.com/privkey.pem;

    client_max_body_size 105m;   # 与文档上传上限匹配(100MB + 余量)

    # SSE流式问答: 关闭缓冲, 保证token实时推送
    location /api/chat/stream {
        proxy_pass http://rag_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        chunked_transfer_encoding on;
    }

    # 其余API
    location /api/ {
        proxy_pass http://rag_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Trace-Id $http_x_trace_id;
        proxy_read_timeout 120s;
    }

    # 聊天页面与Swagger
    location / {
        proxy_pass http://rag_backend;
        proxy_set_header Host $host;
    }
}
